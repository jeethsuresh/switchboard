apply plugin: 'com.android.application'
android {
    namespace 'ca.jeeth.switchboard'
    compileSdk 36
    defaultConfig {
        applicationId 'ca.jeeth.switchboard'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
        testInstrumentationRunner 'ca.jeeth.switchboard.WatchNextProbe'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
